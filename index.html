            .view {

        overflow-y: auto; overflow-x: hidden; 
        background: transparent; 
        padding-bottom: calc(60px + var(--safe-bottom));

        /* 关键：用 visibility 配合淡入淡出动画 */

        transition: opacity 0.25s ease-out; 
        z-index: 10; 
    }
    .view.active { 
        opacity: 1; 
        visibility: visible; 
        z-index: 20;

<!-- Backup scripts: change-log and sync -->
<script src="js/change-log.js"></script>
<script src="js/sync.js"></script>
<script>
// Initialize ChangeLog and Sync, then try to hook into Editor/ColMgr when available.
ChangeLog.init().then(()=>console.log('ChangeLog ready')).catch(e=>console.error('ChangeLog init failed',e));
// Default to same repo; user token should be stored in localStorage under 'github_token'
Sync.init({ owner: 'yutooobig', repo: 'Favorite-tool-page', token: localStorage.getItem('github_token') || '' });

function hookOnce(){
  try{
    if(window.Editor && !window.Editor._backupPublish){
      if(typeof window.Editor.publish === 'function'){
        window.Editor._backupPublish = window.Editor.publish.bind(window.Editor);
        window.Editor.publish = async function(...args){
          try{
            // try to collect current post data
            let post = null;
            if(typeof window.Editor.gatherPost === 'function') post = window.Editor.gatherPost();
            if(!post){
              post = {
                id: document.getElementById('post-title')?.dataset?.postId || ('post_' + Date.now()),
                title: document.getElementById('post-title')?.value || '',
                content: document.getElementById('post-content')?.value || '',
                tags: []
              };
            }
            const path = `data/posts/${post.id}.json`;
            await ChangeLog.addChange({ type: 'update', path, content: JSON.stringify(post) });
            // call original
            const res = await window.Editor._backupPublish(...args);
            if(navigator.onLine) Sync.syncNow().catch(e=>console.warn('Background sync failed',e));
            return res;
          }catch(err){
            console.error('backup wrapper publish error', err);
            return window.Editor._backupPublish(...args);
          }
        };
        console.log('Editor.publish hooked for backup');
      }
    }

    if(window.Editor && !window.Editor._imageHooked && typeof window.Editor.handleImages === 'function'){
      const orig = window.Editor.handleImages.bind(window.Editor);
      window.Editor.handleImages = async function(input){
        try{
          const files = input.files || [];
          for(const f of files){
            await ChangeLog.addChange({ type: 'update', path: `assets/images/${f.name}`, blob: f });
          }
          if(navigator.onLine) Sync.syncNow().catch(()=>{});
        }catch(e){ console.error('image backup failed', e); }
        return orig(input);
      };
      window.Editor._imageHooked = true;
      console.log('Editor.handleImages hooked for backup');
    }

    if(window.ColMgr && !window.ColMgr._backupSave && typeof window.ColMgr.save === 'function'){
      window.ColMgr._backupSave = window.ColMgr.save.bind(window.ColMgr);
      window.ColMgr.save = async function(...a){
        try{
          const title = document.getElementById('col-title-input')?.value || ('col_' + Date.now());
          const desc = document.getElementById('col-desc-input')?.value || '';
          const id = document.getElementById('col-title-input')?.dataset?.colId || ('col_' + Date.now());
          const obj = { id, title, desc, updated_at: Date.now() };
          await ChangeLog.addChange({ type: 'update', path: `data/cols/${id}.json`, content: JSON.stringify(obj) });
          const res = await window.ColMgr._backupSave(...a);
          if(navigator.onLine) Sync.syncNow().catch(()=>{});
          return res;
        }catch(e){ console.error('col backup failed', e); return window.ColMgr._backupSave(...a); }
      };
      console.log('ColMgr.save hooked for backup');
    }
  }catch(e){ console.error(e); }
}
const hookInterval = setInterval(()=>{ hookOnce(); if(window.Editor && window.ColMgr) clearInterval(hookInterval); }, 500);

// expose manual sync API
window.BackupSync = Sync;
</script>
